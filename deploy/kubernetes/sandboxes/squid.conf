# Egress proxy for Open-Inspect sandboxes: CONNECT to port 443 of an
# allowlisted host name, nothing else. Squid resolves names itself, through
# public resolvers, so a sandbox cannot point an allowed name at an internal
# address and cluster or tailnet DNS never answers for it.
http_port 3128
pid_filename none
pinger_enable off
cache deny all
cache_mem 0 MB
cache_store_log none
access_log stdio:/dev/stdout
cache_log stdio:/dev/stderr
logfile_rotate 0
coredump_dir /tmp
shutdown_lifetime 3 seconds
# RESOLVERS: public resolvers for allowlisted names. Change them together
# with the DNS ipBlocks of the egress-proxy NetworkPolicy in
# network-policies.yaml; `npm run test:kubernetes-egress-proxy` checks that
# the two agree.
dns_nameservers 1.1.1.1 9.9.9.9
forwarded_for delete
via off
httpd_suppress_version_string on

acl SSL_ports port 443
acl CONNECT method CONNECT
# -n: match the requested name only, never a reverse lookup of an IP literal.
acl allowlist dstdomain -n "/etc/squid-oi/allowlist.txt"
acl blocked_dst dst "/etc/squid-oi/blocked-destinations.txt"

# Order matters. The allowlist is a name match that needs no lookup, and it
# must come before every dst ACL: a dst ACL makes Squid resolve whatever name
# the sandbox asked for, so a name that is not on the list would still reach
# the public resolvers, and through them an attacker's nameserver (a DNS
# exfiltration channel). Only allowlisted names are ever resolved.
http_access deny !CONNECT
http_access deny !SSL_ports
http_access deny !allowlist
http_access deny to_localhost
http_access deny to_linklocal
# Checked against the addresses the name resolves to, after resolution.
http_access deny blocked_dst
http_access allow allowlist
http_access deny all
