# gVisor for sandbox pods. Requires runsc registered with containerd on the
# nodes that run sandboxes (handler "runsc"); restrict scheduling to them.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: gvisor
handler: runsc
# scheduling:
#   nodeSelector:
#     openinspect.dev/sandbox-node: "true"
# The sentry and gofer use memory the pod's containers do not account for.
overhead:
  podFixed:
    cpu: 100m
    memory: 128Mi
